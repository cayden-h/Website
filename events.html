  <style>
    * { cursor: default; }
    a, button, [role="button"] { cursor: pointer; }

    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background: #FAF8F5;
      color: #0f172a;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      background: linear-gradient(135deg, #a3b18a 0%, #588157 100%);
      top: -150px;
      right: -100px;
      animation: float-1 25s ease-in-out infinite;
    }

    .orb-2 {
      width: 350px;
      height: 350px;
      background: linear-gradient(135deg, #E8E4DE 0%, #d4c8b8 100%);
      bottom: -50px;
      left: -100px;
      animation: float-2 30s ease-in-out infinite;
    }

    @keyframes float-1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-40px, 30px); }
    }

    @keyframes float-2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -20px); }
    }

    .link-hover { position: relative; }
    .link-hover::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 1px;
      background: currentColor;
      transition: width 0.3s ease;
    }
    .link-hover:hover::after { width: 100%; }

    #stage {
      position: fixed;
      inset: 0;
      z-index: 1;
      touch-action: none;
    }
    #stage canvas {
      display: block;
      cursor: grab;
    }
    #stage.dragging canvas { cursor: grabbing; }
    #stage.hovering canvas { cursor: pointer; }

    /* Soft cream vignette so edge cards melt into the background */
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 62% at 50% 50%, transparent 58%, rgba(250, 248, 245, 0.85) 100%);
    }

    .hud { z-index: 10; }

    .hint-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #588157;
      animation: pulse-dot 2.4s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.25); }
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: #FAF8F5;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    .loader-ring {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid #E8E4DE;
      border-top-color: #588157;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #detail {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: #FAF8F5;
      overflow-y: auto;
      opacity: 0;
      visibility: hidden;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: white;
      border: 1px solid #E8E4DE;
      border-radius: 4px;
      font-size: 11px;
      color: #475569;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

  <script type="module">
    import * as THREE from 'three';

    // ---------- config ----------
    const RADIUS = 16;
    const CARD_W = 5.4;
    const TEX_W = 640, TEX_H = 432;
    const CARD_H = CARD_W * TEX_H / TEX_W;
    const ROWS = [
      { lat:  52, n:  9 },
      { lat:  34, n: 13 },
      { lat:  17, n: 15 },
      { lat:   0, n: 16 },
      { lat: -17, n: 15 },
      { lat: -34, n: 13 },
      { lat: -52, n:  9 },
    ];
    const LAT_LIMIT = 38;       // deg, how far you can look up/down
    const DRAG_SENS = 0.115;    // deg per px
    const EASE = 0.075;         // lenis-style lerp factor
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const eventIds = Object.keys(events);
    const stage = document.getElementById('stage');

    // ---------- renderer / scene ----------
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    stage.appendChild(renderer.domElement);

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ---------- card textures (calm style, drawn on canvas) ----------
    const PALETTE = {
      cream: '#FAF8F5', sand: '#E8E4DE', white: '#ffffff',
      slate900: '#0f172a', slate500: '#64748b', slate400: '#94a3b8',
      sage300: '#a3b18a', sage400: '#7f9172', sage500: '#588157', sage600: '#3a5a40',
    };

    function roundRectPath(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function loadImage(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        const giveUp = setTimeout(() => resolve(null), 7000);
        img.onload = () => { clearTimeout(giveUp); resolve(img); };
        img.onerror = () => { clearTimeout(giveUp); resolve(null); };
        img.src = url;
      });
    }

    function drawCard(ev, img, seedIdx) {
      const c = document.createElement('canvas');
      c.width = TEX_W; c.height = TEX_H;
      const x = c.getContext('2d');
      const IMG_H = 308;

      x.clearRect(0, 0, TEX_W, TEX_H);
      roundRectPath(x, 0, 0, TEX_W, TEX_H, 26);
      x.save();
      x.clip();

      // card base
      x.fillStyle = PALETTE.white;
      x.fillRect(0, 0, TEX_W, TEX_H);

      // image area (cover fit) or sage fallback
      if (img) {
        const scale = Math.max(TEX_W / img.width, IMG_H / img.height);
        const dw = img.width * scale, dh = img.height * scale;
        x.drawImage(img, (TEX_W - dw) / 2, (IMG_H - dh) / 2, dw, dh);
        x.fillStyle = 'rgba(88, 129, 87, 0.10)'; // calm sage wash
        x.fillRect(0, 0, TEX_W, IMG_H);
      } else {
        const g = x.createLinearGradient(0, 0, TEX_W, IMG_H);
        g.addColorStop(0, seedIdx % 2 ? PALETTE.sage300 : PALETTE.sage400);
        g.addColorStop(1, PALETTE.sage500);
        x.fillStyle = g;
        x.fillRect(0, 0, TEX_W, IMG_H);
        x.fillStyle = 'rgba(250, 248, 245, 0.85)';
        x.font = '300 120px "Space Grotesk"';
        x.textBaseline = 'middle';
        x.textAlign = 'center';
        x.fillText(ev.title.charAt(0), TEX_W / 2, IMG_H / 2 + 8);
        x.textAlign = 'left';
      }

      // caption strip
      x.fillStyle = PALETTE.white;
      x.fillRect(0, IMG_H, TEX_W, TEX_H - IMG_H);
      x.strokeStyle = PALETTE.sand;
      x.lineWidth = 2;
      x.beginPath();
      x.moveTo(0, IMG_H); x.lineTo(TEX_W, IMG_H);
      x.stroke();

      x.textBaseline = 'alphabetic';
      // type — sage, uppercase, tracked
      x.fillStyle = PALETTE.sage500;
      x.font = '500 19px "Space Grotesk"';
      x.fillText(ev.type.toUpperCase().split('').join(' '), 30, IMG_H + 42);
      // date — right aligned
      x.fillStyle = PALETTE.slate400;
      x.font = '400 19px "Space Grotesk"';
      x.textAlign = 'right';
      x.fillText(ev.date, TEX_W - 30, IMG_H + 42);
      x.textAlign = 'left';
      // title
      x.fillStyle = PALETTE.slate900;
      x.font = '500 34px "Space Grotesk"';
      x.fillText(ev.title, 30, IMG_H + 90);
      // status — sage, right aligned
      if (ev.status) {
        x.fillStyle = PALETTE.sage600;
        x.font = '400 18px "Space Grotesk"';
        x.textAlign = 'right';
        x.fillText(ev.status, TEX_W - 30, IMG_H + 90);
        x.textAlign = 'left';
      }
      x.restore();

      // border
      roundRectPath(x, 1.5, 1.5, TEX_W - 3, TEX_H - 3, 25);
      x.strokeStyle = PALETTE.sand;
      x.lineWidth = 3;
      x.stroke();

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return tex;
    }

    // ---------- build sphere of cards ----------
    const meshes = [];
    const geometry = new THREE.PlaneGeometry(CARD_W, CARD_H);

    async function buildSphere() {
      try { await document.fonts.load('500 34px "Space Grotesk"'); } catch (e) { /* draw with fallback font */ }
      try { await document.fonts.load('300 120px "Space Grotesk"'); } catch (e) { /* draw with fallback font */ }

      const images = await Promise.all(
        eventIds.map((id) => loadImage(`https://picsum.photos/seed/${id}/640/360`))
      );

      const materials = eventIds.map((id, i) => new THREE.MeshBasicMaterial({
        map: drawCard(events[id], images[i], i),
        transparent: true,
        side: THREE.FrontSide,
      }));

      let k = 0;
      ROWS.forEach((row, ri) => {
        const phi = THREE.MathUtils.degToRad(row.lat);
        const y = RADIUS * Math.sin(phi);
        const r = RADIUS * Math.cos(phi);
        for (let i = 0; i < row.n; i++) {
          const theta = (i / row.n) * Math.PI * 2 + ri * 0.45; // stagger rows brick-style
          const idIdx = k % eventIds.length;
          // clone material so each card's opacity animates independently
          const mesh = new THREE.Mesh(geometry, materials[idIdx].clone());
          mesh.position.set(r * Math.cos(theta), y, r * Math.sin(theta));
          mesh.lookAt(0, 0, 0);
          mesh.userData.id = eventIds[idIdx];
          mesh.userData.home = mesh.position.clone();
          scene.add(mesh);
          meshes.push(mesh);
          k++;
        }
      });

      // intro: cards bloom in
      if (!reduceMotion) {
        meshes.forEach((m) => {
          m.scale.setScalar(0.001);
          gsap.to(m.scale, {
            x: 1, y: 1, z: 1,
            duration: 1.1,
            delay: 0.15 + Math.random() * 0.7,
            ease: 'power3.out',
          });
        });
      }

      gsap.to('#loader', {
        autoAlpha: 0, duration: 0.6, delay: 0.2,
        onComplete: () => document.getElementById('loader').remove(),
      });
    }

    // ---------- look controls (drag + lenis-style easing) ----------
    let lon = 0, lat = 0;            // current (eased)
    let targetLon = 0, targetLat = 0; // where we're heading
    let dragging = false, locked = false, interacted = false;
    let downX = 0, downY = 0, lastX = 0, lastY = 0, moved = 0;
    let velX = 0, velY = 0;

    function onDown(e) {
      if (locked) return;
      dragging = true;
      interacted = true;
      stage.classList.add('dragging');
      downX = lastX = e.clientX;
      downY = lastY = e.clientY;
      moved = 0;
      velX = velY = 0;
      gsap.to('#hint', { autoAlpha: 0, duration: 0.5 });
    }

    function onMove(e) {
      if (locked) return;
      if (dragging) {
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        lastX = e.clientX; lastY = e.clientY;
        moved += Math.abs(dx) + Math.abs(dy);
        targetLon -= dx * DRAG_SENS;
        targetLat += dy * DRAG_SENS;
        targetLat = THREE.MathUtils.clamp(targetLat, -LAT_LIMIT, LAT_LIMIT);
        velX = velX * 0.6 + dx * 0.4;
        velY = velY * 0.6 + dy * 0.4;
      } else {
        updateHover(e);
      }
    }

    function onUp(e) {
      if (!dragging) return;
      dragging = false;
      stage.classList.remove('dragging');
      // momentum — keep gliding, the lerp eases it out
      targetLon -= velX * DRAG_SENS * 9;
      targetLat += velY * DRAG_SENS * 9;
      targetLat = THREE.MathUtils.clamp(targetLat, -LAT_LIMIT, LAT_LIMIT);
      if (moved < 7) handleTap(e);
    }

    renderer.domElement.addEventListener('pointerdown', onDown);
    addEventListener('pointermove', onMove);
    addEventListener('pointerup', onUp);

    // trackpad / wheel pans the sphere too, same easing
    renderer.domElement.addEventListener('wheel', (e) => {
      if (locked) return;
      e.preventDefault();
      interacted = true;
      targetLon += e.deltaX * 0.045;
      targetLat = THREE.MathUtils.clamp(targetLat - e.deltaY * 0.045, -LAT_LIMIT, LAT_LIMIT);
      gsap.to('#hint', { autoAlpha: 0, duration: 0.5 });
    }, { passive: false });

    // ---------- hover ----------
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let hovered = null;

    function pick(e) {
      pointer.x = (e.clientX / innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(meshes);
      return hits.length ? hits[0].object : null;
    }

    function updateHover(e) {
      if (locked) return;
      const hit = pick(e);
      if (hit !== hovered) {
        if (hovered) gsap.to(hovered.scale, { x: 1, y: 1, z: 1, duration: 0.45, ease: 'power3.out' });
        hovered = hit;
        if (hovered) gsap.to(hovered.scale, { x: 1.07, y: 1.07, z: 1.07, duration: 0.45, ease: 'power3.out' });
        stage.classList.toggle('hovering', !!hovered);
      }
    }

    // ---------- tap → detail page ----------
    let activeMesh = null;

    function handleTap(e) {
      const hit = pick(e);
      if (hit) openDetail(hit);
    }

    function detailHTML(ev, id) {
      const links = ev.links || {};
      return `
        <button id="detail-back" class="inline-flex items-center gap-2 text-sm text-slate-500 hover:text-sage-600 transition-colors mb-10">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
          back to the sphere
        </button>
        <div class="mb-8">
          <span class="text-xs font-medium text-sage-500 uppercase tracking-wider">${ev.type}</span>
          <h2 class="text-4xl font-light text-slate-900 mt-3">${ev.title}</h2>
          <p class="text-slate-500 mt-2">${ev.location} · ${ev.date}</p>
          ${ev.status ? `<span class="inline-block mt-4 px-3 py-1 bg-sage-500/10 text-sage-600 text-sm rounded-full">${ev.status}</span>` : ''}
        </div>
        <div class="rounded-2xl overflow-hidden border border-sand/60 mb-8">
          <img src="https://picsum.photos/seed/${id}/1280/520" alt="${ev.title}" class="w-full h-56 md:h-72 object-cover">
        </div>
        <p class="text-slate-600 mb-8 leading-relaxed">${ev.description}</p>
        ${ev.highlights && ev.highlights.length ? `
          <div class="mb-8">
            <h3 class="text-sm font-medium text-slate-900 mb-3">Highlights</h3>
            <ul class="space-y-2">
              ${ev.highlights.map(h => `
                <li class="flex items-start gap-2 text-sm text-slate-600">
                  <svg class="w-4 h-4 text-sage-500 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                  ${h}
                </li>`).join('')}
            </ul>
          </div>` : ''}
        ${ev.techStack && ev.techStack.length ? `
          <div class="mb-8">
            <h3 class="text-sm font-medium text-slate-900 mb-3">Technologies</h3>
            <div class="flex flex-wrap gap-2">${ev.techStack.map(t => `<span class="tag">${t}</span>`).join('')}</div>
          </div>` : ''}
        ${ev.teammates && ev.teammates.length ? `
          <div class="mb-8">
            <h3 class="text-sm font-medium text-slate-900 mb-3">Teammates</h3>
            <div class="flex flex-wrap gap-2">
              ${ev.teammates.map(m => `<span class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-sage-500/10 text-sage-700 text-sm rounded-full">${m}</span>`).join('')}
            </div>
          </div>` : ''}
        ${Object.values(links).some(Boolean) ? `
          <div class="pt-6 border-t border-sand/60">
            <div class="flex flex-wrap gap-3">
              ${Object.entries(links).filter(([, url]) => url).map(([label, url]) => `
                <a href="${url}" target="_blank" class="inline-flex items-center gap-2 px-4 py-2 bg-slate-900 text-white text-sm rounded-lg hover:bg-slate-800 transition-colors capitalize">${label}</a>`).join('')}
            </div>
          </div>` : ''}
      `;
    }

    function openDetail(mesh) {
      if (locked) return;
      locked = true;
      activeMesh = mesh;
      stage.classList.remove('hovering');
      if (hovered) { gsap.killTweensOf(hovered.scale); hovered = null; }

      const id = mesh.userData.id;
      const ev = events[id];

      // center the view on the tapped card
      const p = mesh.userData.home;
      const cardLat = THREE.MathUtils.radToDeg(Math.asin(p.y / RADIUS));
      const cardLon = THREE.MathUtils.radToDeg(Math.atan2(p.z, p.x));
      const lonDelta = ((cardLon - lon + 540) % 360) - 180;
      const look = { lon, lat };
      gsap.to(look, {
        lon: lon + lonDelta,
        lat: THREE.MathUtils.clamp(cardLat, -LAT_LIMIT, LAT_LIMIT),
        duration: 0.9, ease: 'power3.inOut',
        onUpdate: () => { lon = targetLon = look.lon; lat = targetLat = look.lat; },
      });

      // the tapped card glides toward you, everything else melts away
      const near = p.clone().normalize().multiplyScalar(6.5);
      gsap.to(mesh.position, { x: near.x, y: near.y, z: near.z, duration: 0.95, ease: 'power3.inOut' });
      gsap.to(mesh.scale, { x: 1.45, y: 1.45, z: 1.45, duration: 0.95, ease: 'power3.inOut' });
      meshes.forEach((m) => {
        if (m !== mesh) gsap.to(m.material, { opacity: 0, duration: 0.55, ease: 'power2.in' });
      });

      // detail page in
      const detail = document.getElementById('detail');
      detail.querySelector('.detail-inner').innerHTML = detailHTML(ev, id);
      detail.scrollTop = 0;
      document.getElementById('detail-back').addEventListener('click', closeDetail);

      gsap.to(detail, { autoAlpha: 1, duration: 0.55, delay: 0.55, ease: 'power2.out' });
      gsap.fromTo('#detail .detail-inner > *',
        { y: 36, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, stagger: 0.06, duration: 0.7, delay: 0.65, ease: 'power3.out' });
    }

    function closeDetail() {
      if (!activeMesh) return;
      const mesh = activeMesh;
      const home = mesh.userData.home;

      gsap.to('#detail', {
        autoAlpha: 0, duration: 0.45, ease: 'power2.in',
        onComplete: () => { document.querySelector('#detail .detail-inner').innerHTML = ''; },
      });
      gsap.to(mesh.position, { x: home.x, y: home.y, z: home.z, duration: 0.9, delay: 0.15, ease: 'power3.inOut' });
      gsap.to(mesh.scale, { x: 1, y: 1, z: 1, duration: 0.9, delay: 0.15, ease: 'power3.inOut' });
      meshes.forEach((m) => {
        if (m !== mesh) gsap.to(m.material, { opacity: 1, duration: 0.7, delay: 0.35, ease: 'power2.out' });
      });
      gsap.delayedCall(0.9, () => { locked = false; activeMesh = null; });
    }

    addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && activeMesh) closeDetail();
    });

    // ---------- render loop ----------
    const lookTarget = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);

      // gentle drift until first touch
      if (!interacted && !locked && !reduceMotion) targetLon += 0.018;

      if (!locked) {
        lon += (targetLon - lon) * EASE;
        lat += (targetLat - lat) * EASE;
      }

      const phi = THREE.MathUtils.degToRad(90 - lat);
      const theta = THREE.MathUtils.degToRad(lon);
      lookTarget.set(
        Math.sin(phi) * Math.cos(theta),
        Math.cos(phi),
        Math.sin(phi) * Math.sin(theta)
      );
      camera.lookAt(lookTarget);

      renderer.render(scene, camera);
    }

    buildSphere();
    animate();
  </script>

  <!-- Vercel Speed Insights -->
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
