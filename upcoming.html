  <style>
    * { cursor: default; }
    a, button, [role="button"], input, .row { cursor: pointer; }
    input { cursor: text; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background: #FAF8F5;
      color: #0f172a;
      overflow-x: hidden;
    }

    /* Ambient orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.12;
      pointer-events: none;
      z-index: -1;
    }
    .orb-1 {
      width: 500px;
      height: 500px;
      background: linear-gradient(135deg, #a3b18a 0%, #588157 100%);
      top: -150px;
      right: -100px;
      animation: float-1 25s ease-in-out infinite;
    }
    .orb-2 {
      width: 350px;
      height: 350px;
      background: linear-gradient(135deg, #E8E4DE 0%, #d4c8b8 100%);
      bottom: -50px;
      left: -100px;
      animation: float-2 30s ease-in-out infinite;
    }
    @keyframes float-1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-40px, 30px); }
    }
    @keyframes float-2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -20px); }
    }

    .link-hover { position: relative; }
    .link-hover::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 1px;
      background: currentColor;
      transition: width 0.3s ease;
    }
    .link-hover:hover::after { width: 100%; }

    /* Search input */
    .search-input {
      width: 100%;
      padding: 14px 20px 14px 48px;
      border: 1px solid rgba(232, 228, 222, 0.6);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(8px);
      font-family: inherit;
      font-size: 14px;
      color: #0f172a;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .search-input::placeholder { color: #94a3b8; }
    .search-input:focus {
      outline: none;
      border-color: #588157;
      box-shadow: 0 0 0 3px rgba(88, 129, 87, 0.08);
    }

    /* Category chips */
    .cat {
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(232, 228, 222, 0.8);
      background: rgba(255, 255, 255, 0.5);
      color: #64748b;
      transition: all 0.2s ease;
      letter-spacing: 0.01em;
    }
    .cat:hover {
      border-color: #a3b18a;
      color: #3a5a40;
    }
    .cat.on {
      background: rgba(88, 129, 87, 0.08);
      border-color: #588157;
      color: #3a5a40;
      font-weight: 500;
    }

    /* Section header */
    .sec {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #94a3b8;
      padding: 32px 0 12px 0;
      margin-bottom: 4px;
    }
    .sec:first-child { padding-top: 8px; }

    /* Program row card */
    .row {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(232, 228, 222, 0.6);
      border-radius: 14px;
      padding: 18px 22px;
      margin-bottom: 10px;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      display: grid;
      grid-template-columns: 8px 1fr auto;
      gap: 16px;
      align-items: start;
    }
    .row:hover {
      transform: translateY(-2px);
      border-color: #588157;
      box-shadow: 0 10px 40px -10px rgba(88, 129, 87, 0.18);
    }
    .row.open {
      border-color: #588157;
      box-shadow: 0 10px 40px -10px rgba(88, 129, 87, 0.18);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 7px;
    }
    .rname {
      font-size: 16px;
      font-weight: 500;
      color: #0f172a;
      line-height: 1.35;
    }
    .rorg {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
    }
    .t {
      font-size: 10px;
      letter-spacing: 0.04em;
      padding: 3px 9px;
      border-radius: 999px;
      font-weight: 500;
    }
    .t-fly  { background: rgba(88, 129, 87, 0.10); color: #3a5a40; }
    .t-paid { background: rgba(88, 129, 87, 0.16); color: #3a5a40; }
    .t-div  { background: rgba(99, 102, 241, 0.10); color: #4338ca; }
    .t-fin  { background: rgba(100, 116, 139, 0.10); color: #475569; }
    .t-self { background: rgba(232, 228, 222, 0.6); color: #475569; }
    .t-comp { background: rgba(163, 177, 138, 0.18); color: #3a5a40; }
    .t-hack { background: rgba(99, 102, 241, 0.10); color: #4338ca; }

    .meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }
    .dl {
      font-size: 10px;
      letter-spacing: 0.04em;
      padding: 3px 10px;
      border-radius: 6px;
      background: rgba(232, 228, 222, 0.5);
      color: #475569;
      white-space: nowrap;
    }
    .pay-note {
      font-size: 10px;
      letter-spacing: 0.04em;
      padding: 3px 10px;
      border-radius: 6px;
      background: rgba(88, 129, 87, 0.10);
      color: #3a5a40;
      font-weight: 500;
      max-width: 220px;
      text-align: right;
    }
    .chv {
      color: #cbd5e1;
      font-size: 11px;
      transition: transform 0.2s ease, color 0.2s ease;
      margin-top: 2px;
    }
    .row:hover .chv { color: #588157; }
    .row.open .chv { transform: rotate(180deg); color: #588157; }

    .detail {
      grid-column: 1 / -1;
      display: none;
      margin-top: 14px;
      padding-top: 16px;
      border-top: 1px solid rgba(232, 228, 222, 0.7);
    }
    .detail.show { display: block; }
    .dg {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .di { font-size: 12px; }
    .di strong {
      display: block;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #94a3b8;
      margin-bottom: 4px;
      font-weight: 500;
    }
    .di span { color: #334155; }
    .desc {
      font-size: 13px;
      color: #475569;
      line-height: 1.7;
      margin-bottom: 12px;
    }
    .why {
      background: rgba(232, 228, 222, 0.35);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12px;
      color: #475569;
      line-height: 1.65;
      margin-bottom: 14px;
      border: 1px solid rgba(232, 228, 222, 0.6);
    }
    .why strong { color: #0f172a; font-weight: 600; }
    .btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .apply-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 8px 16px;
      border-radius: 8px;
      background: #3a5a40;
      color: #FAF8F5;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .apply-btn:hover { background: #588157; transform: translateX(2px); }

    .empty {
      text-align: center;
      padding: 60px 20px;
      font-size: 14px;
      color: #94a3b8;
      font-style: italic;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      html { scroll-behavior: auto; }
    }
  </style>
</head>

      {n:"Hult Prize",o:"Hult International Business School · Campus → Regional → Global",c:"case",col:"#0A2540",fly:1,paid:0,div:0,self:0,fin:0,dl:"~Dec 2026 (campus round)",open:"~Sept 2026",pay:"$1,000,000 prize for global winner",loc:"Campus → Regional summits → Global Finals",desc:"World's largest student social-impact business competition — teams build a startup pitch around the year's UN-aligned challenge prompt. Campus round → Regional Summits (~25 cities globally) → Global Finals. $1M seed prize for the global winner.",why:"$1M global prize and a multi-stage runway that lets you advance over a full year. Even a regional summit appearance is a strong resume credential.",link:"https://www.hultprize.org/"},
      {n:"CFA Institute Research Challenge",o:"CFA Institute · Local → Regional → Global",c:"case",col:"#1B3A6B",fly:1,paid:0,div:0,self:0,fin:1,dl:"~Oct 2026",open:"~Sept 2026",pay:"Travel covered for advancing teams",loc:"Local → Regional → Global Finals",desc:"Teams of 3–5 build a full equity research report and stock recommendation on a real public company, then defend it to CFA charterholders. Local → sub-regional → regional → global rounds, with travel covered as you advance.",why:"The CFA Research Challenge produces an actual published research report you can show recruiters — directly mirrors junior IB and ER analyst work.",link:"https://www.cfainstitute.org/programs/research-challenge"},
      {n:"College Fed Challenge",o:"Federal Reserve · Regional → National Finals at Federal Reserve Board",c:"case",col:"#00563F",fly:1,paid:0,div:0,self:0,fin:1,dl:"~Sept 2026",open:"~Aug 2026",pay:"Travel to DC finals covered",loc:"Regional Fed banks → Federal Reserve Board, Washington, DC",desc:"Teams analyze current US macroeconomic conditions and present an FOMC-style monetary policy recommendation to Fed economists. Regional rounds at Federal Reserve Banks → National Finals at the Fed Board in Washington, DC.",why:"Direct exposure to Fed economists and the most rigorous monetary policy competition for undergrads. Unique credential for macro, fixed income, or econ-focused careers.",link:"https://www.federalreserve.gov/conferences/college-fed-challenge.htm"},
      {n:"NIBC Competition",o:"National Investment Banking Competition · Online → Vancouver finals",c:"case",col:"#00205B",fly:1,paid:0,div:0,self:1,fin:1,dl:"~Nov 2026",open:"~Sept 2026",pay:"Cash prizes; finals travel partially covered",loc:"Online → Vancouver, BC, Canada (finals)",desc:"Largest student investment banking competition globally. ~1,000+ teams from 100+ schools. Online qualifying round (M&A/valuation cases) → in-person finals in Vancouver judged by senior bankers from MS, Goldman, RBC, and others. Direct IB recruiter access at finals.",why:"NIBC is the gold-standard undergrad IB competition. Even an online-round placing on your resume signals serious IB technical preparation.",link:"https://nibc.ca/"},

    ];

    let cat = 'all', q = '', openI = null;

    function setCat(c, btn) {
      cat = c;
      openI = null;
      document.querySelectorAll('.cat').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      render();
    }

    function doSearch(v) {
      q = v.toLowerCase();
      openI = null;
      render();
    }

    // Toggle a row open/closed WITHOUT re-rendering the list.
    // Re-rendering would replay the stagger animation and feel jarring.
    function toggle(i) {
      const target = document.querySelector(`#list .row[data-idx="${i}"]`);
      if (!target) return;
      const detail = target.querySelector('.detail');

      // Close any other row that's currently open
      document.querySelectorAll('#list .row.open').forEach(row => {
        if (row === target) return;
        const d = row.querySelector('.detail');
        row.classList.remove('open');
        gsap.to(d, {
          opacity: 0, duration: 0.15, ease: 'power2.in', overwrite: true,
          onComplete: () => d.classList.remove('show')
        });
      });

      if (target.classList.contains('open')) {
        target.classList.remove('open');
        openI = null;
        gsap.to(detail, {
          opacity: 0, duration: 0.18, ease: 'power2.in', overwrite: true,
          onComplete: () => detail.classList.remove('show')
        });
      } else {
        target.classList.add('open');
        openI = i;
        detail.classList.add('show');
        gsap.fromTo(detail,
          { opacity: 0, y: -4 },
          { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out', overwrite: true }
        );
      }
    }

    function pass(p) {
      const sq = !q || (p.n + p.o + p.desc + p.loc).toLowerCase().includes(q);
      if (!sq) return false;
      if (cat === 'all') return true;
      if (cat === 'swe') return p.c === 'swe';
      if (cat === 'case') return p.c === 'case';
      if (cat === 'hack') return p.c === 'hack';
      if (cat === 'fly') return p.fly;
      if (cat === 'paid') return p.paid;
      if (cat === 'self') return p.self;
      if (cat === 'fin') return p.fin;
      if (cat === 'div') return p.div;
      return true;
    }

    const SECS = {
      swe_paid: 'Sophomore programs — paid internships, fellowships, in-person',
      swe_other: 'Sophomore programs — unpaid insight days, workshops, fellowships',
      hack_main: 'Hackathons — multi-day builds, prizes, travel often funded',
      case_fly: 'Case competitions — travel funded or expenses covered',
      case_self: 'Case competitions — self-funded (high value)'
    };

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function render() {
      const filtered = P.filter(pass);
      document.getElementById('cnt').textContent = filtered.length + ' programs';

      const grps = { swe_paid: [], swe_other: [], hack_main: [], case_fly: [], case_self: [] };
      filtered.forEach(p => {
        const idx = P.indexOf(p);
        if (p.c === 'hack') grps.hack_main.push({ p, idx });
        else if (p.c === 'swe' && p.paid) grps.swe_paid.push({ p, idx });
        else if (p.c === 'swe') grps.swe_other.push({ p, idx });
        else if (p.c === 'case' && (p.fly || !p.self)) grps.case_fly.push({ p, idx });
        else grps.case_self.push({ p, idx });
      });

      let html = '';
      if (!filtered.length) {
        html = '<div class="empty">No programs match. Try a different filter or search.</div>';
      } else {
        Object.entries(grps).forEach(([key, list]) => {
          if (!list.length) return;
          html += `<div class="sec">${SECS[key]} <span class="text-slate-300">·</span> ${list.length}</div>`;
          list.forEach(({ p, idx }) => {
            const isO = openI === idx;
            const tags = [
              p.fly ? '<span class="t t-fly">✈ travel funded</span>' : '',
              p.paid ? '<span class="t t-paid">paid</span>' : '',
              p.div ? '<span class="t t-div">diversity program</span>' : '',
              p.fin ? '<span class="t t-fin">finance-adjacent</span>' : '',
              p.self ? '<span class="t t-self">self-funded</span>' : '',
              p.c === 'case' ? '<span class="t t-comp">competition</span>' : '',
              p.c === 'hack' ? '<span class="t t-hack">hackathon</span>' : ''
            ].filter(Boolean).join('');

            html += `<div class="row${isO ? ' open' : ''}" data-idx="${idx}" onclick="toggle(${idx})">
              <div class="dot" style="background:${p.col}"></div>
              <div class="min-w-0">
                <div class="rname">${escapeHtml(p.n)}</div>
                <div class="rorg">${escapeHtml(p.o)}</div>
                <div class="tags">${tags}</div>
              </div>
              <div class="meta">
                <div class="dl">${escapeHtml(p.dl)}</div>
                ${p.pay ? `<div class="pay-note">${escapeHtml(p.pay)}</div>` : ''}
                <div class="chv">▾</div>
              </div>
              <div class="detail${isO ? ' show' : ''}">
                <div class="dg">
                  <div class="di"><strong>Opens</strong><span>${escapeHtml(p.open)}</span></div>
                  <div class="di"><strong>Deadline</strong><span>${escapeHtml(p.dl)}</span></div>
                  <div class="di"><strong>Pay / Prize</strong><span>${escapeHtml(p.pay || 'See link')}</span></div>
                  <div class="di"><strong>Location</strong><span>${escapeHtml(p.loc)}</span></div>
                </div>
                <div class="desc">${escapeHtml(p.desc)}</div>
                <div class="why"><strong>Why it matters:</strong> ${escapeHtml(p.why)}</div>
                <div class="btns">
                  <a class="apply-btn" href="${p.link}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
                    Apply / Learn more
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                      <path d="M9 5l7 7-7 7"/>
                    </svg>
                  </a>
                </div>
              </div>
            </div>`;
          });
        });
      }
      document.getElementById('list').innerHTML = html;

      gsap.fromTo('#list .row',
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.4, stagger: 0.03, ease: 'power2.out', overwrite: true }
      );
    }

    document.addEventListener('DOMContentLoaded', () => {
      gsap.registerPlugin(ScrollTrigger);

      gsap.from('.hero-content', {
        opacity: 0,
        y: 30,
        duration: 1,
        ease: 'power3.out',
        delay: 0.1
      });

      gsap.from('.filter-section', {
        opacity: 0,
        y: 20,
        duration: 0.8,
        ease: 'power2.out',
        delay: 0.25
      });

      render();
    });
  </script>
